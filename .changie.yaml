changesDir: .changes
unreleasedDir: unreleased
headerPath: header.md
versionHeaderPath: ""
versionFooterPath: ""
versionExt: md
envPrefix: CHANGIE

projectsVersionSeparator: "-"

projects:
    - label: CatConfLang.TestRunner.Abstractions
      key: abstractions
      changelog: tools/CatConfLang.TestRunner.Abstractions/CHANGELOG.md
    - label: CatConfLang.TestRunner
      key: testrunner
      changelog: tools/CatConfLang.TestRunner/CHANGELOG.md

versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
    - label: Added
      auto: minor
    - label: Fixed
      auto: patch
    - label: Performance
      auto: patch
    - label: Changed
      auto: patch
    - label: Reverted
      auto: patch
    - label: Dependencies
      auto: patch
    - label: Security
      auto: patch
newlines:
    afterChangelogHeader: 1
    afterChangelogVersion: 1
    afterKind: 1
    afterVersion: 1
    beforeKind: 1
    endOfVersion: 1
