name: Publish to NuGet

# Trusted publishing: nuget.org exchanges the GitHub OIDC token for a
# short-lived API key at push time. No long-lived NUGET_API_KEY secret.
#
# One-time setup on nuget.org:
#   1. Sign in at nuget.org with the account that owns the CatConfLang.* prefix.
#   2. Reserve the prefix (Account → Reserved package IDs).
#   3. Account → Trusted Publishing → Add publisher:
#        - Publisher: GitHub Actions
#        - Repository owner: CatConfLang
#        - Repository:       ccl-dotnet
#        - Workflow file:    publish-nuget.yml
#        - Environment:      nuget-publish (matches `environment:` below)
#        - Package owner:    your nuget.org account/org
#        - Package pattern:  CatConfLang.*
#   4. Create the GitHub environment "nuget-publish" with required reviewers.
#
# Triggered by changie auto-tag pushing per-project tags like
# `abstractions-v1.0.0` or `testrunner-v1.0.0`, or via manual dispatch.

on:
  push:
    tags:
      - 'abstractions-v*'
      - 'testrunner-v*'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to publish'
        required: true
        type: choice
        options:
          - abstractions
          - testrunner
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

permissions:
  id-token: write   # required for OIDC exchange with nuget.org
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve project and version
        id: resolve
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_PROJECT" ] && [ -n "$INPUT_VERSION" ]; then
            project="$INPUT_PROJECT"
            version="$INPUT_VERSION"
          else
            # Tag format: <project>-v<version>, e.g. abstractions-v1.0.0
            project="${REF_NAME%%-v*}"
            version="${REF_NAME#${project}-v}"
          fi

          # Validate project key against the known set.
          case "$project" in
            abstractions) csproj="tools/CatConfLang.TestRunner.Abstractions/CatConfLang.TestRunner.Abstractions.csproj" ;;
            testrunner)   csproj="tools/CatConfLang.TestRunner/CatConfLang.TestRunner.csproj" ;;
            *)
              echo "Refusing to publish: unknown project '$project'." >&2
              exit 1
              ;;
          esac

          # Reject anything that isn't a plain SemVer-ish string. Defends
          # against shell-meta or arg injection through dispatch input / tag.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Refusing to publish: '$version' is not a valid version string." >&2
            exit 1
          fi

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "csproj=$csproj"   >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CSPROJ: ${{ steps.resolve.outputs.csproj }}
        run: dotnet pack "$CSPROJ" -c Release -p:Version="$VERSION" -o ./artifacts

      - name: Login to NuGet (trusted publishing)
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: NuGetTrustedPublisher

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push './artifacts/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
