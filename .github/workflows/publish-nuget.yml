name: Publish to NuGet

# Trusted publishing: nuget.org exchanges the GitHub OIDC token for a
# short-lived API key at push time. No long-lived NUGET_API_KEY secret.
#
# One-time setup on nuget.org:
#   1. Sign in at nuget.org with the account that owns the CatConfLang.* prefix.
#   2. Reserve the prefix (Account → Reserved package IDs).
#   3. Account → Trusted Publishing → Add publisher:
#        - Publisher: GitHub Actions
#        - Repository owner: CatConfLang
#        - Repository:       ccl-dotnet
#        - Workflow file:    publish-nuget.yml
#        - Environment:      nuget-publish (matches `environment:` below)
#        - Package owner:    your nuget.org account/org
#        - Package pattern:  CatConfLang.*
#   4. Create the GitHub environment "nuget-publish" with required reviewers.
#
# Triggered by pushing a tag like `v1.0.0` or via manual dispatch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). Leave blank to use tag.'
        required: false

permissions:
  id-token: write   # required for OIDC exchange with nuget.org
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            value="$INPUT_VERSION"
          else
            value="${REF_NAME#v}"
          fi
          # Reject anything that isn't a plain SemVer-ish string. Defends
          # against shell-meta or arg injection through dispatch input / tag.
          if ! printf '%s' "$value" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Refusing to publish: '$value' is not a valid version string." >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: dotnet pack -c Release -p:Version="$VERSION" -o ./artifacts

      - name: Login to NuGet (trusted publishing)
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: NuGetTrustedPublisher

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push './artifacts/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
